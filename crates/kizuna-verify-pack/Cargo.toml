[package]
name = "kizuna-verify-pack"
version = "0.1.0"
description = "KIZUNA evidence pack format: builder and standalone offline verifier (no database, no network)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kizuna-verify-pack"
path = "src/main.rs"

[dependencies]
audit-engine = { path = "../audit-engine" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
time.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
