[package]
name = "kizuna-api"
version = "0.1.0"
description = "KIZUNA Verify API server and admin CLI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
audit-engine = { path = "../audit-engine" }
kizuna-verify-pack = { path = "../kizuna-verify-pack" }
policy-engine = { path = "../policy-engine" }
evidence-core = { path = "../evidence-core" }
entity-resolution = { path = "../entity-resolution" }
conflict-engine = { path = "../conflict-engine" }
domain-manufacturing = { path = "../domain-manufacturing" }
dependency-engine = { path = "../dependency-engine" }
security-detection = { path = "../security-detection" }
integrity-signals = { path = "../integrity-signals" }
rust_decimal.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util", "process", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "set-header"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service", "server-graceful"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
rand = "0.9"
base64 = "0.22"
subtle = "2"
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Ops pilot: worker seccomp filter (ADR 0016), fd passing to bwrap, alert delivery (SMTP, Telegram Bot API).
seccompiler = "0.5"
command-fds = { version = "0.3", features = ["tokio"] }
libc = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }

[dev-dependencies]
proptest.workspace = true
http-body-util = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
http-body = "1"
webauthn-authenticator-rs = { version = "0.6", features = ["softpasskey"] }

[lints]
workspace = true
