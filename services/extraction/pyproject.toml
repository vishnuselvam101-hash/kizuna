[project]
name = "kizuna-extraction"
version = "0.1.0"
description = "KIZUNA isolated document extraction worker"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.21.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
