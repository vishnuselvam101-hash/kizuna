[project]
name = "kizuna-extraction"
version = "0.1.0"
description = "KIZUNA isolated document extraction worker"
requires-python = ">=3.12"
dependencies = [
    "pypdf==6.21.4",  # exact: runs inside the sandbox; upgrade deliberately (docs/research/dependencies.md)
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests launch fixed argv (prlimit/bwrap/python) and pass sandbox paths like /tmp as literal arguments.
"tests/*" = ["S603", "S108", "S311"]  # S311: seeded corpus generator, not crypto

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
