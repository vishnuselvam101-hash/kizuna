# cargo-deny policy (deep review KZ-SC3). Run by scripts/check.sh: `cargo deny check`.
[graph]
all-features = false

[advisories]
# cargo-audit is the advisory gate; keep the same documented ignore (rsa via sqlx-mysql, not compiled).
ignore = ["RUSTSEC-2023-0071"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "MPL-2.0", "Unicode-3.0", "Zlib", "OFL-1.1", "CC0-1.0", "CDLA-Permissive-2.0", "0BSD",
]
confidence-threshold = 0.9

# Our own (unpublished) workspace crates.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
