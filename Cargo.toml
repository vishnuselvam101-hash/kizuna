[workspace]
resolver = "3"
members = [
    "crates/audit-engine",
    "crates/policy-engine",
    "crates/evidence-core",
    "crates/entity-resolution",
    "crates/conflict-engine",
    "crates/domain-manufacturing",
    "crates/dependency-engine",
    "crates/kizuna-api",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
proptest = "1"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"

# Password hashing / crypto are far too slow unoptimised; keep tests realistic and fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
