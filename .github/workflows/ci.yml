name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.18"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Create roles and test database
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE kizuna LOGIN PASSWORD 'ci_owner'" \
            -c "CREATE ROLE kizuna_app LOGIN PASSWORD 'ci_app'" -c "CREATE DATABASE kizuna_test OWNER kizuna"
          psql -h 127.0.0.1 -U postgres -d kizuna_test -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC; ALTER SCHEMA public OWNER TO kizuna"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE kizuna_cialt_owner LOGIN PASSWORD 'ci_alt_owner'" \
            -c "CREATE ROLE kizuna_cialt_app LOGIN PASSWORD 'ci_alt_app'" -c "CREATE DATABASE kizuna_test_alt OWNER kizuna_cialt_owner"
          psql -h 127.0.0.1 -U postgres -d kizuna_test_alt -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC; ALTER SCHEMA public OWNER TO kizuna_cialt_owner"
          {
            echo "KIZUNA_TEST_DATABASE_URL=postgres://kizuna_app:ci_app@127.0.0.1:5432/kizuna_test"
            echo "KIZUNA_TEST_OWNER_DATABASE_URL=postgres://kizuna:ci_owner@127.0.0.1:5432/kizuna_test"
            echo "KIZUNA_TEST_ALT_OWNER_DATABASE_URL=postgres://kizuna_cialt_owner:ci_alt_owner@127.0.0.1:5432/kizuna_test_alt"
            echo "KIZUNA_TEST_ALT_DATABASE_URL=postgres://kizuna_cialt_app:ci_alt_app@127.0.0.1:5432/kizuna_test_alt"
            echo "KIZUNA_REQUIRE_ALT_ROLES=1"
          } >> "$GITHUB_ENV"
      - name: Actions are pinned by commit SHA (deep review KZ-SC1)
        run: "! grep -E 'uses: ' .github/workflows/*.yml | grep -vE 'uses: [^@ ]+@[0-9a-f]{40}( |$)'"
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo install cargo-deny --locked --version 0.20.2
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSLo /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
      - run: cd web && pnpm install --frozen-lockfile
      - run: scripts/check.sh
